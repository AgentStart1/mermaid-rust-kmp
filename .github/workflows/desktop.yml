name: Verify desktop native libraries

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, 'codex/**']

env:
  CARGO_TERM_COLOR: never

jobs:
  desktop-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: linux-x86_64
          - runner: windows-latest
            host: windows-x86_64
          - runner: macos-15-intel
            host: darwin-x86_64
          - runner: macos-15
            host: darwin-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install matching binding generator
        run: cargo install boltffi_cli --color never --version 0.26.1 --locked
      - name: Test package validation
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build desktop JNI library
        run: python scripts/build-desktop-jni.py
      - name: Test generated Kotlin APIs
        shell: bash
        run: bash sample/gradlew -p desktop-test check jvmJar --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.host }}
          path: mermaid-ffi/dist/kotlin-multiplatform/src/jvmMain/resources/native/
          if-no-files-found: error

