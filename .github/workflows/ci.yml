name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'mermaid-ffi/**'
      - 'patch-ffi.sh'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - 'scripts/**'
      - 'desktop-test/**'
      - 'templates/**'
  pull_request:
    branches:
      - main
    paths:
      - 'mermaid-ffi/**'
      - 'patch-ffi.sh'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - 'scripts/**'
      - 'desktop-test/**'
      - 'templates/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  desktop-native:
    strategy:
      fail-fast: false
      matrix:
        # Start with Linux on main; PRs retain all four desktop hosts.
        include: ${{ fromJSON(github.event_name == 'push' &&
          '[{"runner":"ubuntu-latest","host":"linux-x86_64"}]' ||
          '[{"runner":"ubuntu-latest","host":"linux-x86_64"},
            {"runner":"windows-latest","host":"windows-x86_64"},
            {"runner":"macos-15-intel","host":"darwin-x86_64"},
            {"runner":"macos-15","host":"darwin-aarch64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Cache Rust and binding generator
        uses: ./.github/actions/build-cache
        with:
          build-key: desktop-${{ matrix.host }}
      - name: Build desktop JNI library
        run: python scripts/build-desktop-jni.py
      - name: Test package validation
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          # Save the main baseline as well as same-PR rerun caches.
          cache-read-only: false

      - name: Test generated Kotlin APIs with local JNI library
        shell: bash
        run: |
          bash sample/gradlew -p desktop-test check jvmJar --console=plain

  android-wasm-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android,wasm32-unknown-unknown

      - name: Cache Rust and binding generator
        uses: ./.github/actions/build-cache
        with:
          build-key: android-wasm

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('scripts/build-wasm.py', 'mermaid-ffi/boltffi.toml', 'patch-ffi.sh', 'templates/kmp/**') }}
          restore-keys: |
            npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-

      - name: Install clang and Binaryen
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          python scripts/install-binaryen.py

      - name: Build native libraries and generate bindings
        working-directory: mermaid-ffi
        run: |
          python ../scripts/generate-kmp.py
          boltffi pack android --release --deny-skipped
          python ../scripts/build-desktop-jni.py
          python ../scripts/build-wasm.py

      - name: Patch generated files
        run: ./patch-ffi.sh

      - name: Test actual Wasm rendering
        run: |
          npm install --prefix mermaid-ffi/dist/wasm/pkg --ignore-scripts
          node scripts/test-wasm-rendering.mjs

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          # Save the main baseline as well as same-PR rerun caches.
          cache-read-only: false

      - name: Build KMP project
        working-directory: mermaid-ffi/dist/kotlin-multiplatform
        run: ./gradlew build -Pversion="0.0.0-test" -Pgroup="com.storyteller_f.mermaid"
