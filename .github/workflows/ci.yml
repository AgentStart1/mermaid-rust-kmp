name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mermaid-ffi/**'
      - 'patch-ffi.sh'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'desktop-test/**'
      - 'templates/**'

env:
  CARGO_TERM_COLOR: never

jobs:
  desktop-native:
    uses: ./.github/workflows/build-native.yml

  desktop-tests:
    needs: desktop-native
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: mermaid-ffi/dist/kotlin-multiplatform/
      - name: Test package validation
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test generated Kotlin APIs and complete JVM package
        shell: bash
        run: |
          bash sample/gradlew -p desktop-test check jvmJar --console=plain
          python scripts/check-desktop-package.py desktop-test/build/libs/mermaid-desktop-test-jvm.jar

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android,wasm32-unknown-unknown

      - name: Install clang, BoltFFI, and Binaryen
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          cargo install boltffi_cli --version 0.31.0 --locked
          python scripts/install-binaryen.py

      - name: Build native libraries and generate bindings
        working-directory: mermaid-ffi
        run: |
          python ../scripts/generate-kmp.py
          boltffi pack android --release --deny-skipped
          python ../scripts/build-desktop-jni.py
          python ../scripts/build-wasm.py

      - name: Patch generated files
        run: ./patch-ffi.sh

      - name: Test actual Wasm rendering
        run: |
          npm install --prefix mermaid-ffi/dist/wasm/pkg --ignore-scripts
          node scripts/test-wasm-rendering.mjs

      - name: Build KMP project
        working-directory: mermaid-ffi/dist/kotlin-multiplatform
        run: ./gradlew build -Pversion="0.0.0-test" -Pgroup="com.storyteller_f.mermaid"
