name: Publish to Maven Central & npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  desktop-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: linux-x86_64
          - runner: windows-latest
            host: windows-x86_64
          - runner: macos-15-intel
            host: darwin-x86_64
          - runner: macos-15
            host: darwin-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Cache Rust and binding generator
        uses: ./.github/actions/build-cache
        with:
          build-key: desktop-${{ matrix.host }}
      - name: Build desktop JNI library
        run: python scripts/build-desktop-jni.py
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.host }}
          path: mermaid-ffi/dist/kotlin-multiplatform/src/jvmMain/resources/native/
          if-no-files-found: error

  publish:
    needs: desktop-native
    if: github.repository == 'storytellerF/mermaid-rust-kmp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '>=22.14.0 <23'
          package-manager-cache: false

      - name: Install npm with Trusted Publishing support
        run: |
          npm install --global npm@11.21.0 --registry=https://registry.npmjs.org
          node --version
          npm --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android,wasm32-unknown-unknown

      - name: Cache Rust and binding generator
        uses: ./.github/actions/build-cache
        with:
          build-key: android-wasm

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('scripts/build-wasm.py', 'mermaid-ffi/boltffi.toml', 'patch-ffi.sh', 'templates/kmp/**') }}
          restore-keys: |
            npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-

      - name: Install clang and Binaryen
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          python scripts/install-binaryen.py

      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build native libraries and generate bindings
        working-directory: mermaid-ffi
        run: |
          python ../scripts/generate-kmp.py
          boltffi pack android --release --deny-skipped
          python ../scripts/build-wasm.py

      - name: Merge desktop build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: mermaid-ffi/dist/kotlin-multiplatform/src/jvmMain/resources/native/

      - name: Patch generated files
        run: ./patch-ffi.sh "$VERSION"

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: enhanced
          # PR merge refs and release tags need writable caches too.
          cache-read-only: false

      - name: Set npm package version and publish
        working-directory: mermaid-ffi/dist/wasm/pkg
        run: |
          npm pkg set repository.type=git repository.url=git+https://github.com/storytellerF/mermaid-rust-kmp.git
          npm version "$VERSION" --no-git-tag-version
          # Ignore build metadata when detecting a SemVer prerelease.
          case "${VERSION%%+*}" in
            *-*) NPM_TAG=next ;;
            *) NPM_TAG=latest ;;
          esac
          npm publish --access public --tag "$NPM_TAG" --registry=https://registry.npmjs.org

      - name: Publish to Maven Central
        working-directory: mermaid-ffi/dist/kotlin-multiplatform
        run: |
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            -Pversion="$VERSION" \
            -Pgroup="io.github.storytellerf"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
