[package]
name = "mermaid-ffi"

[targets.kotlin_multiplatform]
enabled = true
package = "com.storyteller_f.mermaid_kmp"

[targets.wasm]
enabled = true
output = "dist/wasm"

[targets.wasm.npm]
package_name = "mermaid-ffi-wasm"

[targets.android.kotlin]
package = "com.storyteller_f.mermaid_kmp.jvm"
module_name = "MermaidFfi"
output = "dist/kotlin-jni"

[targets.android.pack]
output = "dist/kotlin-multiplatform/src/androidMain/jniLibs"

[targets.wasm.typescript]
runtime_version = "0.31.0"
